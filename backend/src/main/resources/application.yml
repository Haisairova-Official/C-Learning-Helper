spring:
  application:
    name: c-assist-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/c_assist}
    username: ${DB_USERNAME:c_assist}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
cassist:
  ai:
    mode: ${AI_MODE:disabled}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
